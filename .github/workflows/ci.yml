name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 22, cache: npm}
      - run: npm install --no-audit --no-fund
      - run: npm run verify:repo
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  genlayer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m py_compile contracts/genlayer/*.py
      - name: GenVM lint when available
        run: |
          python -m pip install genvm-linter || true
          if command -v genvm-lint >/dev/null 2>&1; then
            for f in contracts/genlayer/*.py; do
              [[ "$(basename "$f")" == test_* ]] && continue
              genvm-lint check "$f"
            done
          else
            echo "genvm-lint CLI unavailable from package index"
          fi
