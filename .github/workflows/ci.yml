name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: npm}
      - run: npm install --no-audit --no-fund
      - run: npm run verify:repo
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  genlayer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-test.txt
      - name: Direct Mode contract tests
        run: |
          mv gltest.config.yaml gltest.config.live.yaml
          trap 'mv gltest.config.live.yaml gltest.config.yaml' EXIT
          python -m pytest tests/direct -q
      - run: genvm-lint check contracts/genlayer/PRAESTAgreementVault.py
      - run: genvm-lint check contracts/genlayer/PRAESTAdjudicator.py
