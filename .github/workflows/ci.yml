name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: npm}
      - run: npm install --no-audit --no-fund
      - run: npm run verify:repo
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  genlayer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m py_compile contracts/genlayer/*.py
      - name: GenVM lint when available
        run: |
          python -m pip install genvm-linter || true
          if command -v genvm-lint >/dev/null 2>&1; then genvm-lint check contracts/genlayer; else echo "genvm-lint CLI unavailable from package index"; fi
  evm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - run: forge install foundry-rs/forge-std
        working-directory: contracts/evm
      - run: forge build
        working-directory: contracts/evm
      - run: forge test -vvv
        working-directory: contracts/evm
  solana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: {workspaces: contracts/solana}
      - run: cargo check --manifest-path contracts/solana/Cargo.toml
      - run: cargo test --manifest-path contracts/solana/Cargo.toml
